spring.application.name=email-campaign-api
server.port=${PORT:8080}

# H2 is the default so the application can be run without installing a database.
# Use the postgres profile for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:campaign_db;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.com.kasplo.emailcampaign=INFO

---
spring.config.activate.on-profile=postgres
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate